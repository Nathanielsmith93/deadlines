<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ffffff" id="tc" />
<title>Deadlines</title>
<style>
  /* ---------- palette: light default, [data-theme=dark] inverts ---------- */
  :root{
    --bg:#ffffff; --card:#ffffff; --line:#d9d4c9; --fg:#000000; --dim:#5a5a5a;
    --red:#b3261e; --amber:#8a5a00; --green:#186a3b; --blue:#1a4fa0;
    --tint:rgba(0,0,0,.035); --shadow:rgba(0,0,0,.14);
  }
  html[data-theme="dark"]{
    --bg:#000000; --card:#0d0d0d; --line:#2e2e2e; --fg:#ffffff; --dim:#a8a8a8;
    --red:#ff6b6b; --amber:#f0b429; --green:#4ade80; --blue:#7aa2ff;
    --tint:rgba(255,255,255,.05); --shadow:rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:17px/1.5 "Times New Roman",Times,"Liberation Serif",serif;
       padding:30px 22px 48px;-webkit-text-size-adjust:100%}
  .wrap{max-width:1080px;margin:0 auto}
  a{color:var(--blue)}
  button,input{font-family:inherit}

  /* ---------- lock screen ---------- */
  #lock{max-width:340px;margin:14vh auto 0;text-align:center}
  #lock h1{font-size:23px;margin:0 0 6px;font-weight:700}
  #lock p{color:var(--dim);font-size:15px;margin:0 0 18px}
  #lock input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:4px;padding:12px 14px;font-size:16px;text-align:center;letter-spacing:.08em}
  #lock input:focus{outline:none;border-color:var(--fg)}
  #lock button{width:100%;margin-top:10px;background:var(--fg);color:var(--bg);border:0;
    border-radius:4px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}
  #lock button:disabled{opacity:.6;cursor:default}
  #lockerr{color:var(--red);font-size:14px;min-height:18px;margin-top:10px}
  .remember{display:flex;align-items:center;justify-content:center;gap:7px;
    color:var(--dim);font-size:14px;margin-top:12px}
  .remember input{width:auto;margin:0}

  /* ---------- header ---------- */
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
  h1{font-size:30px;margin:0;font-weight:700;letter-spacing:-.4px}
  .term{color:var(--dim);font-size:17px;font-style:italic}
  .hactions{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative}
  .hbtn{background:var(--card);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent}
  .hbtn:hover{color:var(--fg);border-color:var(--fg)}
  .hbtn.active{color:var(--bg);background:var(--fg);border-color:var(--fg);font-weight:700}
  .hbtn .dot{display:inline-block;width:6px;height:6px;border-radius:99px;
    background:var(--amber);margin-left:5px;vertical-align:2px}
  .sub{color:var(--dim);font-size:15px;font-style:italic;margin-bottom:18px}

  /* ---------- filter popover ---------- */
  #pop{position:absolute;top:calc(100% + 8px);right:0;z-index:40;min-width:228px;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    box-shadow:0 8px 24px var(--shadow);padding:12px 14px 13px;text-align:left}
  #pop h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--dim);font-weight:700}
  #pop h4:not(:first-child){margin-top:14px}
  .opt{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:15px}
  .opt input{margin:0;accent-color:var(--fg)}
  .opt span.n{margin-left:auto;color:var(--dim);font-size:13px;
    font-variant-numeric:tabular-nums}
  #pop .reset{margin-top:13px;width:100%;background:transparent;border:1px solid var(--line);
    color:var(--dim);border-radius:4px;padding:7px;font-size:14px;cursor:pointer}
  #pop .reset:hover{color:var(--fg);border-color:var(--fg)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr) 1.65fr;gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:11px 14px}
  .stat b{display:block;font-size:25px;line-height:1.15;font-weight:700}
  .stat span{color:var(--dim);font-size:13px}
  #nextup{font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums;
          letter-spacing:-.3px}

  /* ---------- two-column layout ---------- */
  .layout{display:grid;grid-template-columns:186px minmax(0,1fr);gap:26px;align-items:start}
  .layout > aside, .layout > main{min-width:0}
  aside{position:sticky;top:20px}
  aside h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--dim);font-weight:700}
  .cbtn{display:flex;align-items:center;width:100%;gap:8px;background:transparent;
    border:0;border-left:3px solid transparent;color:var(--dim);cursor:pointer;
    padding:7px 9px;font-size:15px;text-align:left;border-radius:0 4px 4px 0;
    -webkit-tap-highlight-color:transparent}
  .cbtn:hover{background:var(--tint);color:var(--fg)}
  .cbtn.on{background:var(--tint);border-left-color:var(--fg);color:var(--fg);font-weight:700}
  .cbtn .n{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
  .cbtn.on .n{color:var(--fg)}
  .cbtn.all{border-bottom:1px solid var(--line);border-radius:0;margin-bottom:5px;
    padding-bottom:9px}

  /* ---------- progress ---------- */
  details.prog{margin-top:20px}
  details.prog summary{color:var(--dim);font-size:12px;text-transform:uppercase;
    letter-spacing:.1em;cursor:pointer;padding:4px 0}
  .prow{margin:9px 0;font-size:13px}
  .prow .pt{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
  .prow .pc{font-weight:700}
  .prow .pn{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
  .bar{height:7px;background:var(--tint);border:1px solid var(--line);
       border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green)}

  /* ---------- search + active chips ---------- */
  .search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:4px;padding:10px 13px;font-size:16px;margin-bottom:11px}
  .search:focus{outline:none;border-color:var(--fg)}
  #chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
  #chips button{background:var(--tint);border:1px solid var(--line);color:var(--fg);
    border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
  #chips button::after{content:" ×";color:var(--dim);font-weight:700}
  #chips button:hover::after{color:var(--red)}

  /* ---------- list ---------- */
  .group{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.1em;
         margin:20px 0 9px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .group:first-child{margin-top:6px}
  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);
        border-radius:5px;padding:13px 15px;margin-bottom:9px;
        display:flex;gap:13px;align-items:flex-start}
  .item.red{border-left-color:var(--red)} .item.amber{border-left-color:var(--amber)}
  .item.green{border-left-color:var(--green)} .item.blue{border-left-color:var(--blue)}
  .item.gray{border-left-color:var(--line)}
  .item.done{opacity:.45}
  .item.done .title{text-decoration:line-through}
  .tick{flex:none;width:22px;height:22px;margin-top:2px;border:1.5px solid var(--line);
    border-radius:3px;background:transparent;cursor:pointer;color:transparent;
    font-size:14px;line-height:1;padding:0;-webkit-tap-highlight-color:transparent}
  .tick:hover{border-color:var(--green)}
  .item.done .tick{background:var(--green);border-color:var(--green);color:var(--bg)}
  .flag{background:var(--tint);color:var(--amber);border:1px solid var(--amber);
        border-radius:3px;padding:0 6px;font-size:11px;font-weight:700;
        vertical-align:2px;margin-left:6px}
  .main{flex:1;min-width:0}
  .title{font-weight:700;font-size:17px}
  .meta{color:var(--dim);font-size:14px;margin-top:3px}
  .notes{color:var(--dim);font-size:14px;margin-top:5px;font-style:italic}
  .course{display:inline-block;background:var(--tint);border:1px solid var(--line);
          border-radius:3px;padding:0 7px;font-size:13px;margin-right:7px;font-weight:700}
  .when{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
  .when b{display:block;font-size:16px;font-weight:700}
  .when small{color:var(--dim);font-size:13px}
  .red b{color:var(--red)} .amber b{color:var(--amber)} .green b{color:var(--green)}
  .empty{color:var(--dim);padding:24px 0;font-style:italic}
  footer{color:var(--dim);font-size:13px;margin-top:30px;border-top:1px solid var(--line);
         padding-top:13px;font-style:italic}
  code{background:var(--tint);border:1px solid var(--line);border-radius:3px;
       padding:0 5px;font-family:"Courier New",monospace;font-style:normal}
  .hide{display:none !important}

  /* ---------- phone / tablet ---------- */
  @media (max-width:820px){
    .layout{grid-template-columns:minmax(0,1fr);gap:14px}
    aside{position:static;min-width:0;max-width:100%}
    aside h4{display:none}
    #courses{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;
      max-width:100%;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;-ms-overflow-style:none}
    #courses::-webkit-scrollbar{display:none}
    .cbtn{width:auto;flex:none;border:1px solid var(--line);border-left-width:1px;
      border-radius:999px;padding:5px 13px;font-size:14px;white-space:nowrap}
    .cbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
    .cbtn.on .n{color:var(--bg)}
    .cbtn.all{border-bottom:1px solid var(--line);border-radius:999px;margin-bottom:0;
      padding-bottom:5px}
    details.prog{margin-top:4px}
  }
  @media (max-width:560px){
    body{padding:16px 13px 40px;font-size:16px}
    h1{font-size:24px}
    .term{font-size:15px}
    .sub{font-size:14px;margin-bottom:14px}

    /* header actions get real tap targets and sit on their own row */
    .hactions{margin-left:0;width:100%;margin-top:9px;gap:9px}
    .hbtn{flex:1;padding:11px 14px;font-size:15px;text-align:center;min-height:44px}

    /* stats: 2 up, counter full width */
    .stats{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
    .stat{padding:9px 11px} .stat b{font-size:20px}
    .stat span{font-size:12px}
    .stat:last-child{grid-column:1 / -1}
    #nextup{font-size:22px}

    /* course chips: thumb-sized, edge-to-edge scroll */
    #courses{margin:0 -13px 2px;padding:2px 13px 6px}
    .cbtn{min-height:44px;padding:9px 15px;font-size:15px}

    /* popover fills the width so options are easy to hit */
    #pop{right:auto;left:0;width:calc(100vw - 26px);min-width:0}
    .opt{padding:10px 0;font-size:16px;min-height:44px}
    #pop .reset{padding:12px;font-size:15px;min-height:44px}

    .search{padding:12px 13px;min-height:44px}
    #chips button{padding:7px 13px;font-size:14px;min-height:36px}

    /* cards: let long notes wrap instead of clipping */
    .item{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:13px 13px;
          align-items:start}
    .title{font-size:16px;line-height:1.35}
    .main{min-width:0;overflow-wrap:anywhere}
    .meta,.notes{font-size:13.5px;overflow-wrap:anywhere;white-space:normal}
    .tick{width:26px;height:26px;font-size:15px}
    .main{grid-column:2}
    .when{grid-column:2;width:100%;text-align:left;margin-top:-4px;
          display:flex;gap:10px;align-items:baseline;white-space:normal;flex-wrap:wrap}
    .when b{display:inline;font-size:15px}
    .when small{font-size:12.5px}
    .group{margin:18px 0 8px;font-size:12px}
  }
</style>
</head>
<body>

<div id="lock" class="hide">
  <h1>&#128274; Deadlines</h1>
  <p>Enter your passphrase to decrypt.</p>
  <form id="lockform" autocomplete="off">
    <input id="pw" type="password" placeholder="passphrase" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" />
    <button id="btn" type="submit">Unlock</button>
  </form>
  <label class="remember"><input id="remember" type="checkbox" /> Keep me unlocked on this device</label>
  <div id="lockerr"></div>
</div>

<div class="wrap hide" id="app">
  <header>
    <h1 id="hd">Deadlines</h1><span class="term" id="term"></span>
    <div class="hactions">
      <button class="hbtn" id="filterbtn" type="button" aria-expanded="false">Filter</button>
      <button class="hbtn" id="themebtn" type="button">Dark mode</button>
      <div id="pop" class="hide"></div>
    </div>
  </header>
  <div class="sub" id="now"></div>
  <div class="stats" id="stats"></div>

  <div class="layout">
    <aside>
      <h4>Courses</h4>
      <div id="courses"></div>
      <details class="prog">
        <summary>Progress</summary>
        <div id="prog"></div>
      </details>
    </aside>
    <main>
      <input class="search" id="q" type="search" placeholder="Search title, course or notes&hellip;"
             autocapitalize="off" autocorrect="off" />
      <div id="chips"></div>
      <div id="list"></div>
    </main>
  </div>

  <footer>
    <span id="note"></span>
    <span id="stamp">Built Sep 29, 2026 at 01:14 PM.</span>
    <span id="lockout"></span>
  </footer>
</div>

/* ---------- theme ---------- */
const THEME_KEY = "deadlines.theme";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const tc = document.getElementById("tc");
  if(tc) tc.setAttribute("content", t === "dark" ? "#000000" : "#ffffff");
  const b = document.getElementById("themebtn");
  if(b) b.textContent = t === "dark" ? "Light mode" : "Dark mode";
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
}
function initTheme(){
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch(e){}
  if(!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(t);
}
initTheme();   // run before first paint to avoid a flash of the wrong theme
document.addEventListener("click", e => {
  if(e.target && e.target.id === "themebtn"){
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark"
               ? "light" : "dark");
  }
});

let DATA = null, course = "all", query = "";
// Independent view toggles, all off = "everything not yet done".
let V = {done:false, week:false, tbd:false, flagged:false, heavy:false};
let nextDue = null;          // Date of the soonest open item, or null

// Tick the "Next up" counter every second. Updating just this one text node
// (instead of re-rendering) keeps the search box and scroll position intact.
setInterval(() => {
  const el = document.getElementById("nextup");
  if(!el || !nextDue) return;
  const left = nextDue - new Date();
  el.textContent = fmtFull(left);
  if(left <= 0) render();     // rolled past due: regroup into Overdue
}, 1000);

/* ---------- local tick-off state (per device) ---------- */
const DONE_KEY = "deadlines.done.v1";
let doneSet = new Set();
try { doneSet = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]")); } catch(e){}
const idOf = it => (it.course||"") + "|" + (it.title||"");
function toggleDone(id){
  doneSet.has(id) ? doneSet.delete(id) : doneSet.add(id);
  try { localStorage.setItem(DONE_KEY, JSON.stringify([...doneSet])); } catch(e){}
  render();
}

/* ---------- crypto ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(ENC.salt), iterations:ENC.iters, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(ENC.iv)}, key, b64d(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const PW_KEY = "deadlines.pw";
async function tryUnlock(pw, remember){
  DATA = await decrypt(pw);                    // throws on wrong passphrase
  if(remember){ try{ localStorage.setItem(PW_KEY, pw); }catch(e){} }
  document.getElementById("lock").classList.add("hide");
  document.getElementById("app").classList.remove("hide");
  document.getElementById("lockout").innerHTML =
    ' · <a href="#" id="lockbtn">Lock</a>';
  document.getElementById("lockbtn").onclick = e => {
    e.preventDefault(); try{ localStorage.removeItem(PW_KEY); }catch(_){} location.reload(); };
  render();
  setInterval(render, 60000);
}

/* ---------- dates ---------- */
function parseDue(s){
  const m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?$/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], m[4]?+m[4]:23, m[5]?+m[5]:59);
}
function fmtLeft(ms){
  const past = ms < 0; ms = Math.abs(ms);
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, mn = Math.floor(ms/6e4)%60;
  let t = d >= 1 ? `${d}d ${h}h` : (h >= 1 ? `${h}h ${mn}m` : `${mn}m`);
  return past ? t + " ago" : t;
}
// Full precision for the live "Next up" counter: always d/h/m/s.
function fmtFull(ms){
  const past = ms < 0; ms = Math.abs(ms);
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24,
        m = Math.floor(ms/6e4)%60, s = Math.floor(ms/1000)%60;
  const p2 = n => String(n).padStart(2,"0");
  const t = `${d}d ${p2(h)}h ${p2(m)}m ${p2(s)}s`;
  return past ? t + " ago" : t;
}
const fmtDate = dt => dt.toLocaleString(undefined,
  {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function bucket(dt, now){
  const dd = Math.floor((new Date(dt.getFullYear(),dt.getMonth(),dt.getDate())
            - new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  if(dt < now) return ["Overdue", "red"];
  if(dd === 0) return ["Today", "red"];
  if(dd === 1) return ["Tomorrow", "amber"];
  if(dd <= 7)  return ["This week", "amber"];
  if(dd <= 21) return ["Coming up", "blue"];
  return ["Later", "blue"];
}
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- render ---------- */
function render(){
  if(!DATA) return;
  const now = new Date();
  document.getElementById("hd").textContent =
    (DATA.student ? DATA.student + "'s " : "") + "Deadlines";
  document.getElementById("term").textContent = DATA.term || "";
  document.getElementById("now").textContent = now.toLocaleString(undefined,
    {weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'});
  document.getElementById("note").textContent = DATA.footnote || "";

  const all = (DATA.deadlines||[]).map(d => {
    const dt = parseDue(d.due);
    const noDate = d.due === null || d.due === undefined || d.due === "";
    const id = idOf(d);
    return {...d, id, dt, noDate, bad: !dt && !noDate,
            done: (d.status||"").toLowerCase() === "done" || doneSet.has(id)};
  }).sort((a,b) => {
    if(!a.dt && !b.dt) return 0;
    if(!a.dt) return 1;
    if(!b.dt) return -1;
    return a.dt - b.dt;
  });

  const open = all.filter(x => !x.done);
  const overdue = open.filter(x => x.dt && x.dt < now);
  const wk = open.filter(x => x.dt && x.dt >= now && (x.dt-now) < 7*864e5);
  const next = open.find(x => x.dt && x.dt >= now);
  const tbd = open.filter(x => x.noDate);
  document.getElementById("stats").innerHTML = [
    ["Open", open.length, ""], ["Overdue", overdue.length, overdue.length?"red":""],
    ["Next 7 days", wk.length, wk.length?"amber":""],
    ["Date TBD", tbd.length, ""],
    ["Next up", next ? fmtFull(next.dt-now) : "—", next?"green":"", "nextup"]
  ].map(([l,v,c,id]) => `<div class="stat"><b${id?` id="${id}"`:""}${
      c?` style="color:var(--${c})"`:""}>${v}</b><span>${l}</span></div>`).join("");
  nextDue = next ? next.dt : null;   // drives the 1s ticker

  // progress by course, weighted by % of final grade
  // ---------- sidebar: one row per course ----------
  const courses = [...new Set(all.map(x=>x.course).filter(Boolean))].sort();
  const openOf = c => all.filter(x => !x.done && (c === "all" || x.course === c)).length;
  document.getElementById("courses").innerHTML =
    `<button class="cbtn all ${course==="all"?"on":""}" data-c="all">All courses
       <span class="n">${openOf("all")}</span></button>` +
    courses.map(c => `<button class="cbtn ${course===c?"on":""}" data-c="${esc(c)}">${esc(c)}
       <span class="n">${openOf(c)}</span></button>`).join("");
  document.querySelectorAll(".cbtn").forEach(b =>
    b.onclick = () => { course = b.dataset.c; render(); });

  // ---------- progress, scoped to the selected course ----------
  const pcs = course === "all" ? courses : [course];
  document.getElementById("prog").innerHTML = pcs.map(c => {
    const items = all.filter(x => x.course === c);
    const tot = items.reduce((s,x) => s + (+x.weight || 0), 0);
    const got = items.filter(x=>x.done).reduce((s,x) => s + (+x.weight || 0), 0);
    const pct = tot ? Math.round(got/tot*100) : 0;
    return `<div class="prow"><div class="pt"><span class="pc">${esc(c)}</span>
      <span class="pn">${got.toFixed(0)}/${tot.toFixed(0)}%</span></div>
      <span class="bar"><i style="width:${pct}%"></i></span></div>`;
  }).join("");

  // ---------- filter popover ----------
  const inWeek = x => x.dt && x.dt >= now && (x.dt-now) < 7*864e5;
  const counts = {
    done: all.filter(x=>x.done).length,
    week: all.filter(x=>!x.done && inWeek(x)).length,
    tbd: all.filter(x=>!x.done && x.noDate).length,
    flagged: all.filter(x=>!x.done && x.confirm).length,
    heavy: all.filter(x=>!x.done && (+x.weight||0) >= 10).length
  };
  const opts = [
    ["week","Due in next 7 days"], ["heavy","Worth 10% or more"],
    ["flagged","Date needs verifying"], ["tbd","No date yet"]
  ];
  const nOn = Object.values(V).filter(Boolean).length;
  document.getElementById("pop").innerHTML =
    `<h4>Show only</h4>` +
    opts.map(([k,l]) => `<label class="opt"><input type="checkbox" data-v="${k}"${
      V[k]?" checked":""} /> ${l}<span class="n">${counts[k]}</span></label>`).join("") +
    `<h4>Completed</h4>
     <label class="opt"><input type="checkbox" data-v="done"${V.done?" checked":""} />
       Include done items<span class="n">${counts.done}</span></label>` +
    (nOn ? `<button class="reset" type="button" id="resetf">Clear filters</button>` : "");
  document.querySelectorAll("#pop input[data-v]").forEach(cb =>
    cb.onchange = () => { V[cb.dataset.v] = cb.checked; render(); });
  const rf = document.getElementById("resetf");
  if(rf) rf.onclick = () => { V = {done:false,week:false,tbd:false,flagged:false,heavy:false}; render(); };
  const fb = document.getElementById("filterbtn");
  fb.classList.toggle("active", nOn > 0);
  fb.innerHTML = "Filter" + (nOn ? ` <span class="dot"></span>` : "");

  // ---------- active-filter chips ----------
  const chipLabels = {...Object.fromEntries(opts), done:"Including done"};
  document.getElementById("chips").innerHTML =
    (course !== "all" ? `<button data-clear="course">${esc(course)}</button>` : "") +
    Object.keys(V).filter(k=>V[k]).map(k=>`<button data-clear="${k}">${chipLabels[k]}</button>`).join("") +
    (query ? `<button data-clear="q">&ldquo;${esc(query)}&rdquo;</button>` : "");
  document.querySelectorAll("#chips button").forEach(b => b.onclick = () => {
    const k = b.dataset.clear;
    if(k === "course") course = "all";
    else if(k === "q"){ query = ""; document.getElementById("q").value = ""; }
    else V[k] = false;
    render();
  });

  // ---------- apply ----------
  let items = all;
  if(course !== "all") items = items.filter(x => x.course === course);
  if(!V.done) items = items.filter(x => !x.done);
  if(V.week) items = items.filter(inWeek);
  if(V.tbd) items = items.filter(x => x.noDate);
  if(V.flagged) items = items.filter(x => x.confirm);
  if(V.heavy) items = items.filter(x => (+x.weight||0) >= 10);
  if(query){
    const qq = query.toLowerCase();
    items = items.filter(x => [x.title,x.course,x.type,x.notes]
      .some(v => String(v||"").toLowerCase().includes(qq)));
  }

  const list = document.getElementById("list");
  if(!items.length){ list.innerHTML = `<div class="empty">Nothing matches these filters.</div>`; return; }
  let html = "", lastGroup = null;
  for(const it of items){
    if(it.bad){
      html += `<div class="item red"><div class="main"><div class="title">${esc(it.title||"Untitled")}</div>
               <div class="meta">Unreadable date: <code>${esc(String(it.due))}</code></div></div></div>`;
      continue;
    }
    const [g, color] = it.done ? ["Done","green"]
                     : it.noDate ? ["Date TBD — check CourseLink","gray"]
                     : bucket(it.dt, now);
    if(g !== lastGroup){ html += `<div class="group">${g}</div>`; lastGroup = g; }
    const left = (it.done || it.noDate) ? "" : `<b>${fmtLeft(it.dt-now)}</b>`;
    const when = it.noDate ? `<small>no date</small>` : `<small>${fmtDate(it.dt)}</small>`;
    html += `<div class="item ${color}${it.done?" done":""}">
      <button class="tick" data-id="${esc(it.id)}" title="Mark done">✓</button>
      <div class="main">
        <div class="title">${esc(it.title||"Untitled")}${
          it.confirm && !it.done ? ` <span class="flag" title="Date inferred — verify it">verify date</span>` : ""}</div>
        <div class="meta">${it.course?`<span class="course">${esc(it.course)}</span>`:""}${esc(it.type||"")}${
          (it.weight||it.weight===0)?` · ${it.weight}% of grade`:""}</div>
        ${it.notes?`<div class="notes">${esc(it.notes)}</div>`:""}
      </div>
      <div class="when ${color}">${left}${when}</div>
    </div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll(".tick").forEach(b => b.onclick = () => toggleDone(b.dataset.id));
}

/* ---------- boot ---------- */
document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });

/* ---------- filter popover open/close ---------- */
const pop = document.getElementById("pop"), fbtn = document.getElementById("filterbtn");
function setPop(open){
  pop.classList.toggle("hide", !open);
  fbtn.setAttribute("aria-expanded", open ? "true" : "false");
}
fbtn.addEventListener("click", e => { e.stopPropagation(); setPop(pop.classList.contains("hide")); });
pop.addEventListener("click", e => e.stopPropagation());       // keep it open while ticking
document.addEventListener("click", () => setPop(false));
document.addEventListener("keydown", e => { if(e.key === "Escape") setPop(false); });

(async function boot(){
  if(!ENC){                                  // unencrypted build
    DATA = BAKED;
    document.getElementById("app").classList.remove("hide");
    render(); setInterval(render, 60000);
    return;
  }
  const lock = document.getElementById("lock");
  lock.classList.remove("hide");
  const saved = (()=>{ try{ return localStorage.getItem(PW_KEY); }catch(e){ return null; } })();
  if(saved){
    try { await tryUnlock(saved, false); return; }
    catch(e){ try{ localStorage.removeItem(PW_KEY); }catch(_){} }
  }
  const pw = document.getElementById("pw"), btn = document.getElementById("btn"),
        err = document.getElementById("lockerr");
  pw.focus();
  document.getElementById("lockform").addEventListener("submit", async e => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = "Decrypting…"; err.textContent = "";
    try {
      await tryUnlock(pw.value, document.getElementById("remember").checked);
    } catch(ex) {
      err.textContent = "Wrong passphrase.";
      btn.disabled = false; btn.textContent = "Unlock";
      pw.select();
    }
  });
})();
</script>
